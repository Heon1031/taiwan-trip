<style>
/* Layout: Toss-style app page. Light grey ground, white rounded cards, bold sans headings, blue accent. One panel at a time. Sticky tab bar on top; one tab panel at a time: map first, then schedule, then tap-to-open place and food tiles. Single light theme on purpose (white paper look). */
:root{
  color-scheme:light;
  --paper:#FFFFFF; --ink:#18201D; --muted:#5B6661; --rule:#E3E8E5; --tint:#F3F6F4; --wash:#EAF2EE;
  --jade:#12705D; --jade-deep:#0C5244; --lantern:#B23F2B; --lantern-wash:#FBEDEA;
  --display:"Gowun Batang","Nanum Myeongjo",serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --zh:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.7;margin:0;word-break:keep-all;overflow-wrap:break-word}
h1,h2,h3,.sheet h3{text-wrap:balance}
.lead,.sheet p{text-wrap:pretty}
.wrap{max-width:640px;margin:0 auto;padding-inline:18px;padding-block:0 64px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.3;font-weight:700}
img{max-width:100%;display:block}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--jade);outline-offset:2px}

/* top bar + bottom bar (guided navigation, no tab strip) */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--rule);margin-inline:-18px;padding:10px 18px;display:flex;align-items:center;gap:10px;min-height:56px}
.topbar .back{border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:8px 14px;font-size:16px;font-weight:500;cursor:pointer;white-space:nowrap}
.topbar .where{font-family:var(--display);font-weight:700;font-size:18px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--paper);border-top:1px solid var(--rule);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bottombar .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bottombar button{border:1px solid var(--rule);background:var(--paper);border-radius:12px;padding:12px 8px;font-size:16px;font-weight:700;cursor:pointer;line-height:1.3}
.bottombar button.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.bottombar button small{display:block;font-weight:400;font-size:13px;opacity:.8}
.bottombar button:disabled{visibility:hidden}
.has-bottom{padding-bottom:110px}
/* home */
.hello{margin-top:20px;display:grid;gap:6px;align-content:end;min-height:240px;padding:24px 20px;border-radius:20px;color:#fff;background:linear-gradient(180deg,rgba(0,0,0,.05) 30%,rgba(0,0,0,.6)),url('img/hero.jpg') center 30%/cover}
.hello h1{font-size:30px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.hello p{margin:0;color:rgba(255,255,255,.92)}
.theme p{margin:0 0 10px;color:var(--muted);line-height:1.6}
.theme ul{list-style:none;margin:0;padding:0;border:1px solid var(--rule);border-radius:16px;background:var(--paper)}
.theme li{display:grid;grid-template-columns:6.8em 1fr;gap:2px 12px;padding:12px 16px;border-top:1px solid var(--rule)}
.theme li:first-child{border-top:0}
.theme li b{grid-row:span 2;font-size:15px}
.theme li span{font-size:15px}
.theme li small{color:var(--muted);font-size:13px}
.ask{font-family:var(--display);font-size:22px;font-weight:700;margin:28px 0 12px}
.daybtns{display:grid;gap:12px}
.daybtn{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;text-align:left;border:1px solid var(--rule);background:var(--paper);border-radius:16px;padding:16px;cursor:pointer}
.daybtn:hover{border-color:var(--ink)}
.daybtn .num{width:56px;height:56px;border-radius:50%;background:var(--tint);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:20px;color:var(--jade);line-height:1}
.daybtn .num small{display:block;font-family:var(--body);font-size:11px;font-weight:500;color:var(--muted)}
.daybtn .txt{min-width:0;font-weight:700;font-size:19px;line-height:1.4}
.daybtn .txt small{display:block;font-weight:400;font-size:15px;color:var(--muted)}
.daybtn .arrow{font-size:26px;color:var(--muted)}
.daybtn.today{border:2px solid var(--lantern)}
.badge{display:inline-block;font-size:12px;font-weight:700;color:#fff;background:var(--lantern);border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:3px}
.helpbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.helpbtn{text-align:left;border:0;background:var(--tint);border-radius:16px;padding:16px;cursor:pointer;font-weight:700;font-size:18px;line-height:1.35}
.helpbtn small{display:block;font-weight:400;font-size:14px;color:var(--muted);margin-top:2px}
.howto{margin-top:22px;font-size:15px;color:var(--muted);background:var(--tint);border-radius:12px;padding:12px 14px}
.sched li.tap{cursor:pointer}
.sched li.tap{position:relative;padding-right:26px}
.sched .more{position:absolute;right:2px;top:50%;transform:translateY(-50%);font-size:0;line-height:1}
.sched .more::after{content:'›';font-size:26px;font-weight:400;color:#b7bcb8}
.panel{padding-top:24px}
.kicker{font-size:14px;font-weight:700;letter-spacing:.06em;color:var(--lantern)}
.panel h2{font-size:30px;margin-top:4px}
.lead{color:var(--muted);margin:6px 0 0}

.map{margin:20px 0 0;border:1px solid var(--rule);border-radius:12px;overflow:hidden;background:#fff}
.map{cursor:zoom-in}
.sheet.mapview img{max-height:none;object-fit:contain;background:#fff}
.zv{position:fixed;inset:0;z-index:30;background:#1b1f1d;display:flex;flex-direction:column}
.zv[hidden]{display:none}
.zv-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;background:#1b1f1d;color:#cfd5d2}
.zv-bar button{min-height:44px;min-width:44px;padding:0 16px;border-radius:999px;border:0;background:#fff;color:#1a1f1d;font-size:17px;font-weight:700;cursor:pointer}
.zv-z{display:flex;gap:8px}
.zv-hint{font-size:13px;flex:1;text-align:center}
@media (max-width:420px){.zv-hint{display:none}}
.zv-stage{flex:1;position:relative;overflow:hidden;touch-action:none;background:#fff}
#zvImg{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;user-select:none;-webkit-user-select:none;-webkit-user-drag:none}
.map figcaption{font-size:14px;color:var(--muted);padding:8px 12px;border-top:1px solid var(--rule)}

.h3{font-family:var(--display);font-size:21px;margin:30px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--ink)}

/* schedule */
.sched{list-style:none;margin:0;padding:0}
.sched li{display:grid;grid-template-columns:46px 20px 1fr;gap:0 10px;padding:9px 0;position:relative}
.sched li::before{content:'';position:absolute;left:65px;top:0;bottom:0;border-left:2px solid #dde2de}
.sched li.move::before{border-left-style:dashed;border-left-color:#c9cfca}
.sched li:first-child::before{top:18px}
.sched li:last-child::before{bottom:calc(100% - 18px)}
.sched time{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;color:var(--ink);padding-top:3px}
.sched .dot{position:relative;z-index:1;justify-self:center;width:12px;height:12px;margin-top:10px;border-radius:50%;background:var(--jade);box-shadow:0 0 0 3px var(--paper)}
.sched li.meal .dot{background:var(--lantern)}
.sched li.optrow .dot{background:var(--paper);border:2px solid var(--jade);width:12px;height:12px;box-sizing:border-box}
.sched li.move{padding:4px 0;align-items:center}
.sched li.move time{color:var(--muted);font-weight:500;font-size:13px;padding-top:0}
.sched .mvdot{width:20px;height:20px;margin:0;background:var(--paper);box-shadow:none;border-radius:0;display:grid;place-items:center;color:#8f9792}
.sched .mvdot svg{width:16px;height:16px}
.sched .mv{display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden;font-size:14px;color:var(--muted)}
.sched .mv span{overflow:hidden;text-overflow:ellipsis}
.sched .mv em{font-style:normal}
.sched .mv em::before{content:'· '}
.sched .what{min-width:0;font-weight:700;font-size:17px;line-height:1.5}
.sched li.meal .what{color:#8a2e1b}
.sched .what small{display:block;font-weight:400;color:var(--muted);font-size:14.5px;line-height:1.5;margin-top:1px}
.opt{font-size:12px;font-weight:700;color:var(--muted);border:1px solid var(--rule);border-radius:6px;padding:1px 6px;margin-left:4px;white-space:nowrap;vertical-align:2px}

/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{display:grid;gap:6px;text-align:left;border:0;background:transparent;padding:0;cursor:pointer}
.tile .ph{aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:var(--tint);position:relative}
.tile .ph img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.tile:hover .ph img{transform:scale(1.03)}
.tile .ph .zhname{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--zh);font-size:30px;font-weight:700;color:var(--jade);text-align:center;padding:10px;line-height:1.3}
.tile .lbl{font-size:13px;font-weight:700;color:var(--lantern)}
.tile .ttl{font-family:var(--display);font-size:18px;font-weight:700;line-height:1.35}
.tile .more{font-size:13px;color:var(--muted);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile.wide{grid-column:1/-1}
.tile.wide .ph{aspect-ratio:16/7}

.note{background:var(--tint);border-radius:10px;padding:12px 14px;font-size:16px;margin-top:16px;color:var(--ink)}

/* overview */
.ovlist{list-style:none;margin:18px 0 0;padding:0;border-top:2px solid var(--ink)}
.ovlist li{border-bottom:1px solid var(--rule)}
.ovlist button{width:100%;display:grid;grid-template-columns:76px 1fr auto;gap:12px;align-items:center;text-align:left;background:transparent;border:0;padding:14px 0;cursor:pointer}
.ovlist .d{font-family:var(--display);font-weight:700;font-size:19px;color:var(--jade);line-height:1.2}
.ovlist .d small{display:block;font-family:var(--body);font-size:13px;font-weight:400;color:var(--muted)}
.ovlist .t{min-width:0;font-weight:500}
.ovlist .t small{display:block;color:var(--muted);font-weight:400;font-size:15px}
.ovlist .go{color:var(--muted);font-size:20px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.fact{background:var(--tint);border-radius:10px;padding:12px 14px}
.fact b{display:block;font-size:13px;color:var(--muted);font-weight:500}
.fact span{font-weight:700}
@media (max-width:420px){.facts{grid-template-columns:1fr}}

/* chinese cards */
.zh-grid{display:grid;gap:10px}
.zh{display:grid;gap:2px;text-align:left;border:1px solid var(--rule);border-radius:12px;background:var(--paper);padding:14px 16px;cursor:pointer}
.zh:hover{border-color:var(--jade)}
.zh .ko{font-size:15px;color:var(--muted)}
.zh .cn{font-family:var(--zh);font-size:24px;font-weight:700;line-height:1.35}

/* tips & contacts */
.tip{padding:14px 0;border-bottom:1px solid var(--rule)}
.tip h3{font-size:19px;margin-bottom:4px}
.tip ul{margin:0;padding-left:20px;font-size:16px}
.tip li{margin:3px 0}
.ct{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--rule)}
.ct .who{min-width:0;font-weight:500}
.ct .who small{display:block;color:var(--muted);font-size:14px;font-weight:400}
.ct .num{display:block;font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;user-select:all}
.ct button{font-size:14px;padding:6px 14px;border-radius:999px;border:1px solid var(--rule);background:var(--paper);cursor:pointer}

/* popups */
.pop{position:fixed;inset:0;z-index:20;background:rgba(20,26,24,.45);display:grid;align-items:end;justify-items:center}
.sheet{background:var(--paper);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.sheet img{width:100%;max-height:52vh;object-fit:cover}
.sheet .in{padding:18px 20px 4px;display:grid;gap:8px}
.sheet .lbl{font-size:14px;font-weight:700;color:var(--lantern)}
.sheet h3{font-size:25px}
.sheet .zhn{font-family:var(--zh);color:var(--muted);font-size:16px}
.sheet p{margin:0;font-size:17px}
.sheet ul{margin:0;padding-left:20px;font-size:16px}
.sheet .spice{display:inline-block;font-size:14px;font-weight:600;color:#b34a00;background:#fff3e8;border-radius:6px;padding:3px 8px;margin:8px 0 0}
.sheet .shop{margin:14px 0 4px;padding:12px 14px;border:1px solid var(--line,#e5e5e5);border-radius:10px;display:flex;flex-direction:column;gap:3px;font-size:14px}
.sheet .shop b{font-family:var(--zh);font-size:15px}
.sheet .shop span{color:var(--muted)}
.sheet .shop a{margin-top:4px;font-weight:600;color:#1a5fb4;text-decoration:none}
.sheet .key{font-weight:700;font-size:18px;margin:10px 0 4px}
.sheet .note2{font-size:13px;color:var(--muted);margin-top:12px}
.sheet .route{margin:18px 0 4px;padding-top:16px;border-top:1px solid var(--rule);display:grid;gap:10px}
.sheet .route h4{margin:0;font-size:18px}
.sheet img.rmap{width:100%;max-height:none;object-fit:contain;border:1px solid var(--rule);border-radius:10px;background:#fff}
.sheet .route ol{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.sheet .route li{display:grid;grid-template-columns:52px 1fr;gap:8px;font-size:15px}
.sheet .route time{font-weight:700;color:var(--lantern)}
.sheet .route li b{display:block;font-size:16px}
.sheet .route li span{color:var(--muted)}
.sheet .route li span{display:block}
.sheet .route a.pinl{display:inline-block;margin-top:2px;font-size:13px}
.sheet .route a.dirbtn{display:block;text-align:center;padding:12px;border-radius:12px;background:#1a5fb4;color:#fff;font-size:16px}
.sheet .route a{font-weight:600;color:#1a5fb4;text-decoration:none}
.sheet .route small{font-size:12px;color:var(--muted)}
.sheet .credit{font-size:12px;color:var(--muted)}
.sheet .close{margin:14px 20px 0;width:calc(100% - 40px);padding:12px;border-radius:12px;border:1px solid var(--rule);background:var(--tint);font-size:17px;cursor:pointer}
@media (min-width:700px){.pop{align-items:center}.sheet{border-radius:18px}}
.card-ov{position:fixed;inset:0;z-index:21;background:var(--paper);display:grid;place-items:center;padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px))}
.card-ov .in{max-width:720px;width:100%;display:grid;gap:18px;text-align:center}
.card-ov .cn{font-family:var(--zh);font-weight:700;font-size:clamp(34px,10vw,64px);line-height:1.35;word-break:keep-all}
.card-ov .ko{color:var(--muted);font-size:18px}
.card-ov button{justify-self:center;font-size:18px;padding:12px 30px;border-radius:999px;border:1px solid var(--rule);background:var(--tint);cursor:pointer}

footer{margin-top:40px;font-size:12px;color:var(--muted);line-height:1.6}
@media (prefers-reduced-motion:reduce){.tile .ph img{transition:none}}

/* refined layer */
.ask{display:flex;align-items:baseline;gap:10px;font-size:22px;margin:34px 0 14px}
.ask::after{content:attr(data-zh);font-family:var(--zh);font-size:13px;font-weight:500;letter-spacing:.2em;color:var(--lantern)}
.h3{display:flex;align-items:baseline;gap:10px;border-bottom:0;padding-bottom:0;margin:36px 0 14px;font-size:22px}
.h3::after{content:attr(data-zh);font-family:var(--zh);font-size:13px;font-weight:500;letter-spacing:.2em;color:var(--lantern)}
.h3::before{content:'';flex:none;width:7px;height:7px;border-radius:2px;background:var(--lantern);transform:translateY(-3px) rotate(45deg)}
.ask::before{content:'';flex:none;width:7px;height:7px;border-radius:2px;background:var(--lantern);transform:translateY(-3px) rotate(45deg)}
.hello{min-height:300px;border-radius:22px;padding:22px 22px 24px;gap:4px;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(8,20,16,.72)),url('img/hero.jpg') center 30%/cover}
.hello .eyebrow{font-family:var(--zh);font-size:13px;letter-spacing:.32em;color:rgba(255,255,255,.85);font-weight:500}
.hello h1{font-size:32px;letter-spacing:-.01em}
.daybtns{gap:10px}
.daybtn{grid-template-columns:84px 1fr auto;gap:14px;padding:10px 12px 10px 10px;border-radius:18px;transition:border-color .2s,background .2s}
.daybtn:hover{border-color:var(--jade);background:var(--wash)}
.daybtn .thumb{position:relative;width:84px;height:84px;border-radius:13px;overflow:hidden;background:var(--tint)}
.daybtn .thumb img{width:100%;height:100%;object-fit:cover}
.daybtn .thumb b{position:absolute;left:6px;bottom:6px;background:var(--paper);color:var(--lantern);font-family:var(--display);font-size:14px;line-height:1;padding:5px 7px 4px;border-radius:7px}
.daybtn .thumb b small{font-family:var(--body);font-size:11px;font-weight:500;color:var(--muted);margin-left:2px}
.daybtn .txt{font-family:var(--display);font-size:19px}
.daybtn .txt small{font-family:var(--body);line-height:1.45;margin-top:2px}
.helpbtn{background:var(--wash);transition:background .2s}
.helpbtn:hover{background:#DFEDE6}
.howto{background:var(--lantern-wash);color:#6d3226}
.kicker{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.kicker .zhd{font-family:var(--zh);font-weight:500;letter-spacing:.14em;color:var(--muted);font-size:13px}
.panel h2{font-size:31px;letter-spacing:-.01em;margin-top:6px}
.lead{font-size:17px;line-height:1.75}
.map{border-radius:16px}
.tile .ph{border-radius:14px}
.tile .ttl{font-size:18.5px}
.bottombar button.primary{background:var(--jade);border-color:var(--jade)}
.bottombar button.primary:hover{background:var(--jade-deep)}
.topbar .back{background:var(--tint);border-color:transparent}
.note{background:var(--wash)}
.sched li.meal .what{color:var(--lantern)}
@media (prefers-reduced-motion:reduce){.daybtn,.helpbtn{transition:none}}
.gmapbtn{display:block;margin-top:10px;text-align:center;padding:13px 14px;border-radius:14px;background:var(--wash);color:var(--jade-deep);font-weight:700;font-size:16px;text-decoration:none}
.gmapbtn:hover{background:#DFEDE6}
.gmapnote{margin:6px 2px 0;font-size:13px;color:var(--muted)}

/* ===== Toss-style layer (overrides above) ===== */
:root{
  --bg:#F2F4F6; --paper:#FFFFFF; --ink:#191F28; --sub:#4E5968; --muted:#8B95A1; --rule:#E5E8EB; --tint:#F2F4F6; --wash:#E8F3FF;
  --jade:#3182F6; --jade-deep:#1B64DA; --lantern:#F04452; --lantern-wash:#FFF0F1;
  --display:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
html,body{background:var(--bg)}
body{color:var(--ink);letter-spacing:-.01em}
h1,h2,h3{font-family:var(--body);font-weight:700;letter-spacing:-.03em}
.ask::before,.ask::after,.h3::before,.h3::after{content:none}

.hello{min-height:260px;border-radius:24px;margin-top:16px;padding:22px;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.55)),url('img/hero.jpg') center 30%/cover}
.hello h1{font-size:28px;font-weight:800;text-shadow:none}
.hello p{font-size:16px;font-weight:500}
.daybtns{gap:10px}
.daybtn{border:0;background:var(--paper);border-radius:20px;padding:14px;grid-template-columns:64px 1fr auto;gap:14px}
.daybtn:hover{background:#FAFBFC;border:0}
.daybtn .thumb{width:64px;height:64px;border-radius:16px}
.daybtn .thumb b{display:none}
.daybtn .txt{font-family:var(--body);font-size:17px;font-weight:700;letter-spacing:-.02em}
.daybtn .txt::before{content:attr(data-date);display:block;font-size:13px;font-weight:600;color:var(--jade);margin-bottom:1px}
.daybtn .txt small{font-size:14px;color:var(--sub);font-weight:400}
.daybtn .arrow{color:#C5CBD3;font-size:22px}
.daybtn.today{box-shadow:0 0 0 2px var(--jade) inset}
.badge{background:var(--jade)}
.helpbtns{gap:10px}
.helpbtn{background:var(--paper);border-radius:20px;padding:18px 16px;font-size:17px;letter-spacing:-.02em}
.helpbtn:hover{background:#FAFBFC}
.helpbtn small{color:var(--sub);font-size:13.5px}
.howto{background:var(--paper);color:var(--sub);border-radius:16px;font-size:14px}
.theme p{color:var(--sub);margin:0 4px 12px;font-size:15.5px}
.theme ul{border:0;border-radius:20px;background:var(--paper)}
.theme li{padding:14px 18px;border-top:1px solid #F2F4F6}
.theme li b{color:var(--sub);font-weight:500}
.theme li span{font-weight:600}
.theme li small{color:var(--muted)}
.map{border:0;border-radius:20px;background:var(--paper)}
.map figcaption{border-top:0;color:var(--muted);font-size:13px;padding:10px 16px 14px}
.gmapbtn{background:var(--paper);color:var(--jade);border-radius:16px;font-size:15.5px}
.gmapbtn:hover{background:#FAFBFC}
.gmapnote{margin:6px 6px 0;color:var(--muted)}
.topbar{background:var(--bg);border-bottom:0}
.topbar .back{background:var(--paper);border:0;font-weight:600;font-size:15px}
.topbar .where{font-family:var(--body);font-size:17px;letter-spacing:-.02em}
.panel{padding-top:20px}
.kicker{font-size:14px;font-weight:600;letter-spacing:0;color:var(--jade);margin-left:4px}
.panel h2{font-size:27px;font-weight:800;margin:6px 4px 0;letter-spacing:-.035em}
.lead{color:var(--sub);font-size:16px;line-height:1.7;margin:10px 4px 0}
.sched{background:var(--paper);border-radius:20px;padding:12px 16px 12px 14px}
.sched .dot{box-shadow:0 0 0 3px var(--paper)}
.sched li::before{border-left-color:#E5E8EB}
.sched li.move::before{border-left-color:#D1D6DB}
.sched .mvdot{background:var(--paper);color:#B0B8C1}
.sched time{color:var(--ink);font-weight:700}
.sched li.move time{color:var(--muted)}
.sched .what{font-weight:600;font-size:16.5px;letter-spacing:-.02em}
.sched li.meal .what{color:var(--ink)}
.sched .what small{color:var(--muted);font-size:14px}
.sched .mv{color:var(--muted)}
.sched .more::after{color:#C5CBD3}
.opt{border:0;background:var(--tint);color:var(--sub)}
.note{background:var(--paper);border-radius:16px;color:var(--sub);font-size:15px}
.tiles{gap:12px}
.tile{background:var(--paper);border-radius:20px;padding:0 0 14px;overflow:hidden;gap:4px}
.tile .ph{border-radius:0}
.tile .lbl,.tile .ttl,.tile .more{padding:0 14px}
.tile .lbl{margin-top:8px;font-size:12.5px;font-weight:600;color:var(--jade)}
.tile .ttl{font-family:var(--body);font-size:16.5px;font-weight:700;letter-spacing:-.02em}
.tile .more{color:var(--muted);font-size:13px}
.tile .ph .zhname{color:var(--jade)}
.bottombar{background:rgba(242,244,246,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:0}

.bottombar button.primary{background:var(--jade);color:#fff}
.bottombar button.primary:hover{background:var(--jade-deep)}
.sheet{border-radius:24px 24px 0 0}
.sheet h3{font-family:var(--body);font-weight:800;font-size:23px;letter-spacing:-.03em}
.sheet .lbl{color:var(--jade);font-weight:600}
.sheet .spice{color:var(--lantern);background:var(--lantern-wash)}
.sheet .shop{border:0;background:var(--tint);border-radius:16px}
.sheet .shop a,.sheet .route a{color:var(--jade)}
.sheet .route a.dirbtn{background:var(--jade);color:#fff;border-radius:16px}
.sheet .route time{color:var(--jade)}
.sheet .close{border:0;background:var(--tint);border-radius:16px;font-weight:600}
.ct button{border:0;background:var(--tint);color:var(--jade);font-weight:600}
.fact{background:var(--paper);border-radius:16px}
.card-ov button{border:0;border-radius:16px;background:var(--jade);color:#fff;font-weight:600}
.zv-bar button{border-radius:14px}
:focus-visible{outline-color:var(--jade)}
.walks{margin-top:12px;background:var(--paper);border-radius:20px;padding:6px 6px 8px}
.walks-h{font-size:14px;font-weight:700;color:var(--sub);padding:10px 12px 6px}

.walks a:hover{background:var(--tint)}
.walks a span{flex:none;font-size:12px;font-weight:700;color:var(--jade);background:var(--wash);border-radius:8px;padding:3px 8px}
.walks a span.car{color:#4E5968;background:var(--tint)}
.walks a i{margin-left:auto;font-style:normal;color:#C5CBD3;font-size:20px}
.walks.in-sheet{background:var(--tint);margin-top:4px}
.sheet .route .walks a{color:var(--ink);font-weight:600;font-size:15.5px}
.walks.in-sheet a:hover{background:#E9ECEF}
.sched .rowmap{display:inline-flex;align-items:center;margin-top:6px;font-size:12px;font-weight:700;color:var(--jade);background:var(--wash);border-radius:8px;padding:3px 9px;text-decoration:none;position:relative;z-index:2}
.sched .rowmap::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:5px}
.walks.maps{margin-top:16px}
.walks a b{display:flex;flex-direction:column;font-weight:600;min-width:0}
.walks a b small{font-size:13px;font-weight:400;color:var(--muted);margin-top:1px}
.walks-note{margin:4px 12px 4px;font-size:13px;line-height:1.55;color:var(--muted)}
.walks button.wbtn{display:flex;align-items:center;gap:10px;width:100%;padding:12px;border:0;border-radius:14px;background:none;color:var(--ink);font:inherit;font-weight:600;font-size:15.5px;text-align:left;cursor:pointer}
.walks button.wbtn:hover{background:var(--tint)}
.walks button.wbtn span{flex:none;font-size:12px;font-weight:700;color:var(--jade);background:var(--wash);border-radius:8px;padding:3px 8px}
.walks a em,.walks button.wbtn em{font-style:normal;font-size:12.5px;font-weight:500;color:var(--muted);margin-left:auto}
.walks a em+i,.walks button.wbtn em+i{margin-left:6px}
.walks button.wbtn i{font-style:normal;color:#C5CBD3;font-size:20px}
.sched .rowroute{display:inline-flex;align-items:center;margin:6px 6px 0 0;font:inherit;font-size:12px;font-weight:700;color:#fff;background:var(--jade);border:0;border-radius:8px;padding:4px 9px;cursor:pointer;position:relative;z-index:2}
.sheet .jumpr{display:flex;width:100%;justify-content:center;margin:14px 0 4px;padding:13px;border:0;border-radius:14px;background:var(--wash);color:var(--jade);font:inherit;font-weight:700;font-size:15px;cursor:pointer}
.sheet .route .nb{display:inline-grid;place-items:center;min-width:22px;height:22px;margin-right:7px;border-radius:50%;background:#2B5797;color:#fff;font-style:normal;font-size:12.5px;font-weight:700;vertical-align:1px}
.sheet .route .nb.p{border-radius:6px;background:#333}
.sheet .rhint{margin:0;font-size:13px;color:var(--muted)}
.sheet h4.about{margin:22px 0 2px;padding-top:16px;border-top:1px solid var(--rule);font-size:18px}
.sched .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.sched .chip{display:inline-flex;align-items:center;gap:4px;height:26px;margin:0;padding:0 10px 0 8px;border:0;border-radius:13px;background:var(--wash);color:var(--jade);font:inherit;font-size:12px;font-weight:700;line-height:1;text-decoration:none;cursor:pointer;position:relative;z-index:2;box-sizing:border-box}
.sched .chip::before{content:none}
.sched .chip svg{width:14px;height:14px;flex:none}
.sched .chip.rowroute{background:var(--jade);color:#fff}
.sheet img.fit{object-fit:contain;max-height:none;background:#fff}
.sched .ok{font-size:12px;font-weight:700;color:#0E7A4F;background:#E3F6EC;border-radius:6px;padding:1px 6px;margin-left:4px;white-space:nowrap;vertical-align:2px}
</style>

  text:['바닷속에 쌓였던 사암층이 땅 위로 솟은 뒤, 바람과 파도에 단단한 부분만 남아 버섯 모양 바위가 됐어요. 제주 용머리해안을 떠올리면 비슷해요.','대표인 \'여왕머리 바위\'는 목 부분이 해마다 조금씩 깎이고 있어, 언젠가 부러질 수 있다고 해요. 그래서 지금 봐 두면 좋아요.'],
  tips:['입장료 1인 NT$120 (약 5천 원) · 65세 이상 할인은 대만 국적만이라 외국인은 보통 NT$120','평평한 길을 1시간 정도 걸어요','바닷바람이 세고 그늘이 없어요. 겉옷과 모자 챙기기'],route:{img:'img/r_yehliu.jpg',map:'https://www.google.com/maps/dir/?api=1&origin=%E9%87%8E%E6%9F%B3%E5%9C%B0%E8%B3%AA%E5%85%AC%E5%9C%92%20%E9%81%8A%E5%AE%A2%E4%B8%AD%E5%BF%83&destination=%E9%87%8E%E6%9F%B3%E5%9C%B0%E8%B3%AA%E5%85%AC%E5%9C%92%20%E9%81%8A%E5%AE%A2%E4%B8%AD%E5%BF%83&travelmode=walking&waypoints=%E9%87%8E%E6%9F%B3%E5%9C%B0%E8%B3%AA%E5%85%AC%E5%9C%92%20%E8%95%88%E7%8B%80%E5%B2%A9%7C%E9%87%8E%E6%9F%B3%20%E5%A5%B3%E7%8E%8B%E9%A0%AD%7C%E9%87%8E%E6%9F%B3%20%E4%BB%99%E5%A5%B3%E9%9E%8B',steps:[['13:00','차에서 내려 매표소로','방문객 센터 앞 · 입장권 사서 곶 끝 쪽으로','https://www.google.com/maps/search/?api=1&query=%E9%87%8E%E6%9F%B3%E5%9C%B0%E8%B3%AA%E5%85%AC%E5%9C%92%20%E9%81%8A%E5%AE%A2%E4%B8%AD%E5%BF%83'],['13:10','1구역 · 버섯바위 무리','버섯 모양 바위가 모여 있는 곳','https://www.google.com/maps/search/?api=1&query=%E9%87%8E%E6%9F%B3%E5%9C%B0%E8%B3%AA%E5%85%AC%E5%9C%92%20%E8%95%88%E7%8B%80%E5%B2%A9'],['13:25','2구역 · 여왕머리 바위','사진 줄이 10~20분','https://www.google.com/maps/search/?api=1&query=%E9%87%8E%E6%9F%B3%20%E5%A5%B3%E7%8E%8B%E9%A0%AD'],['13:45','선녀 신발 바위','여왕머리 바로 옆 · 여기서 돌아가요','https://www.google.com/maps/search/?api=1&query=%E9%87%8E%E6%9F%B3%20%E4%BB%99%E5%A5%B3%E9%9E%8B'],['14:00','같은 길로 돌아와 승차','3구역 바위 해안길은 이번엔 생략 · 시간 남으면 현장에서 판단','https://www.google.com/maps/search/?api=1&query=%E9%87%8E%E6%9F%B3%E5%9C%B0%E8%B3%AA%E5%85%AC%E5%9C%92%20%E9%81%8A%E5%AE%A2%E4%B8%AD%E5%BF%83']]}},
 shifen:{gm:'https://www.google.com/maps/search/?api=1&query=%E5%8D%81%E5%88%86%E8%80%81%E8%A1%97',spots:[['선택', '징안 출렁다리', '시간 남으면 사진', 'https://www.google.com/maps/search/?api=1&query=%E9%9D%9C%E5%AE%89%E5%90%8A%E6%A9%8B']],img:'img/shifen.jpg',lbl:'천등 마을',title:'스펀',zh:'十分',key:'석탄 기찻길 위에서 소원 천등 날리기',
  text:['1921년 일본이 석탄을 실어 나르려고 놓은 핑시선 기찻길이 지금도 마을 한가운데를 지나요. 군산 경암동 철길마을처럼 철길 바로 옆에 가게가 늘어서 있어요.','천등은 옛날 산으로 피신한 마을 사람들에게 \'이제 안전하니 내려오라\'고 알리던 신호였어요. 지금은 큰 종이 등에 소원을 적어 하늘로 날려요.'],

 jiufen:{gm:'https://www.google.com/maps/search/?api=1&query=%E4%B9%9D%E4%BB%BD%E8%80%81%E8%A1%97',spots:[['명소', '아메이 찻집', '홍등 야경 사진 명소', 'https://www.google.com/maps/search/?api=1&query=%E9%98%BF%E5%A6%B9%E8%8C%B6%E6%A8%93'], ['명소', '승평극장', '광산 시절 극장', 'https://www.google.com/maps/search/?api=1&query=%E6%98%87%E5%B9%B3%E6%88%B2%E9%99%A2']],img:'img/jiufen.jpg',lbl:'산골 마을',title:'지우펀',zh:'九份',key:'금광 붐으로 생긴 산비탈 계단 마을',
  text:['옛날 아홉 가구만 살아 물건을 늘 \'아홉 몫\'으로 나눠 사서 이름이 지우펀(九份)이 됐다고 해요. 1890년대 금이 나오며 사람이 몰려 큰 마을이 됐어요.','광산이 닫힌 뒤 조용해졌다가, 1989년 영화 \'비정성시\'의 촬영지가 되며 다시 유명해졌어요. 부산 감천문화마을처럼 산비탈에 계단 골목이 이어지고, 해 질 녘 홍등이 켜지면 가장 아름다워요.'],
  tips:['계단이 많고 비 오면 미끄러워요. 손잡이를 잡고 천천히'],route:{img:'img/r_jiufen.jpg',map:'https://www.google.com/maps/dir/?api=1&origin=7-ELEVEN%20%E4%B9%9D%E4%BB%BD%E9%96%80%E5%B8%82&destination=%E6%98%87%E5%B9%B3%E6%88%B2%E9%99%A2%20%E6%96%B0%E5%8C%97%E5%B8%82%E7%91%9E%E8%8A%B3%E5%8D%80&travelmode=walking&waypoints=%E9%98%BF%E7%8F%A0%E9%9B%AA%E5%9C%A8%E7%87%92%20%E4%B9%9D%E4%BB%BD%7C%E9%98%BF%E5%A6%B9%E8%8C%B6%E6%A8%93%20%E4%B9%9D%E4%BB%BD',steps:[['17:15', '윗입구 세븐일레븐 앞에서 내리기', '여기서 기산제 골목으로 들어가요', 'https://www.google.com/maps/search/?api=1&query=7-ELEVEN%20%E4%B9%9D%E4%BB%BD%E9%96%80%E5%B8%82'], ['17:20', '아주 땅콩아이스크림롤', '입구 근처 간식', 'https://www.google.com/maps/search/?api=1&query=%E9%98%BF%E7%8F%A0%E9%9B%AA%E5%9C%A8%E7%87%92%20%E4%B9%9D%E4%BB%BD'], ['17:45', '기산제 · 수치루 갈림길', '계단길로 내려가요', 'https://www.google.com/maps/search/?api=1&query=%E4%B9%9D%E4%BB%BD%20%E5%9F%BA%E5%B1%B1%E8%A1%97%20%E8%B1%8E%E5%B4%8E%E8%B7%AF'], ['18:00', '아메이 찻집 앞 홍등 계단', '해 진 뒤 홍등 야경 · 찻집에서 쉬어 가도 좋아요', 'https://www.google.com/maps/search/?api=1&query=%E9%98%BF%E5%A6%B9%E8%8C%B6%E6%A8%93%20%E4%B9%9D%E4%BB%BD'], ['18:45', '승평극장 지나 아랫길', '19:00 차 타는 곳은 현지에서 기사님과 정해요', 'https://www.google.com/maps/search/?api=1&query=%E6%98%87%E5%B9%B3%E6%88%B2%E9%99%A2%20%E4%B9%9D%E4%BB%BD']]}},
 raohe:{gm:'https://www.google.com/maps/search/?api=1&query=%E9%A5%92%E6%B2%B3%E8%A1%97%E8%A7%80%E5%85%89%E5%A4%9C%E5%B8%82',spots:[['입구', '츠유궁 (입구 사원)', '송산역 바로 옆 · 여기서 시작', 'https://www.google.com/maps/search/?api=1&query=%E6%9D%BE%E5%B1%B1%E6%85%88%E7%A5%90%E5%AE%AE'], ['간식', '후추빵 (푸저우 스쭈)', '입구 바로 앞 · 줄이 길어도 빨리 줄어요', 'https://www.google.com/maps/search/?api=1&query=%E7%A6%8F%E5%B7%9E%E4%B8%96%E7%A5%96%E8%83%A1%E6%A4%92%E9%A4%85%20%E9%A5%92%E6%B2%B3'], ['간식', '약재갈비탕 (천둥)', '야시장 중간쯤', 'https://www.google.com/maps/search/?api=1&query=%E9%99%B3%E8%91%A3%E8%97%A5%E7%87%89%E6%8E%92%E9%AA%A8%20%E9%A5%92%E6%B2%B3']],img:'img/raohe.jpg',lbl:'야시장',title:'라오허제 야시장',zh:'饒河街觀光夜市',key:'270년 된 사원 앞에서 열리는 먹자골목',
  text:['입구의 츠유궁(慈祐宮)은 1753년 세워진 바다의 여신 사원이에요. 옛날 강가 항구였던 이곳에 시장이 서며 동네가 생겼어요.','지금은 600m 한 줄로 이어진 먹자골목이라 서울 광장시장 같은 분위기예요. 입구 화덕 후추빵이 명물이고, 컷과일도 맛보기 좋아요.'],
  tips:['입구 츠유궁 → 후추빵(입구 바로 앞, 줄 10~20분) → 약재갈비탕(앉아서) → 컷과일 순서로 걸어요','600m 한 줄이라 끝까지 걸은 뒤 반대쪽 끝에서 택시를 타요','맥주는 입구 편의점에서 사요. 대만에서만 파는 18일 생맥주(18天 台灣啤酒)를 추천해요','가방은 앞으로 메요'],note:'피곤하면 숙소로 가도 돼요.'},
 chiikawa:{gm:'https://www.google.com/maps/search/?api=1&query=%E5%90%89%E4%BC%8A%E5%8D%A1%E5%93%87%20CHIIKAWA%20SHOP%20in%20TAIPEI%20%E9%95%B7%E5%AE%89%E8%A5%BF%E8%B7%AF19%E8%99%9F',img:'img/chiikawa.jpg',lbl:'쉬는 시간에 더 놀고 싶다면',title:'치이카와 매장',zh:'吉伊卡哇 CHIIKAWA SHOP',key:'대만 첫 치이카와 상설 매장 (2025년 12월 개장)',
  text:['일본 인기 캐릭터 치이카와의 대만 첫 상설 매장이에요. 대만에서만 파는 한정 인형과 굿즈가 있어요.','매장이 있는 중산역 일대는 서울 연남동처럼 작은 편집숍과 카페가 모인 골목(赤峰街)이 있어서, 같이 둘러보기 좋아요.'],
  tips:['매일 12:00~20:00 · 예약 없이 들어가요','대만 한정 인형은 1인 1개씩만 살 수 있어요','숙소에서 출발 → MRT 용산사역(파란선) → 시먼역에서 초록선 환승 → 중산역 R4 출구 · 약 20분 (택시면 15분)','돌아올 땐 중산역에서 초록선 2정거장이면 시먼역 · 16:30 시먼딩에서 가족과 합류']},
 wulaist:{gm:'https://www.google.com/maps/search/?api=1&query=%E7%83%8F%E4%BE%86%E8%80%81%E8%A1%97',img:'img/wulaist.jpg',lbl:'옛거리',title:'우라이 옛거리',zh:'烏來老街',key:'원주민 음식과 온천 간식이 모인 산골 장터 골목',
  text:['온천 마을 입구에서 남세계곡(南勢溪)을 건너는 다리까지 이어지는 짧은 골목이에요. 원주민 타이야족의 음식과 산골 특산물을 파는 가게가 양옆으로 늘어서 있어요.','멧돼지 소시지, 대나무 통에 쪄 낸 죽통밥, 산후추(마가오) 소시지, 좁쌀술 같은 이곳만의 먹거리가 많아요. 강원도 산골 오일장을 걷는 느낌이에요.'],
  tips:['옛거리 끝 다리를 건너면 꼬마기차 타는 곳이에요','멧돼지 소시지는 줄이 있는 집이 맛있어요']},
 trolley:{gm:'https://www.google.com/maps/search/?api=1&query=%E7%83%8F%E4%BE%86%E5%8F%B0%E8%BB%8A%20%E7%83%8F%E4%BE%86%E7%AB%99',img:'img/trolley.jpg',lbl:'꼬마기차',title:'우라이 꼬마기차',zh:'烏來台車',key:'나무를 나르던 손수레 철길이 관광 열차로',
  text:['일본 통치기에 산에서 벤 나무를 사람이 밀어 나르던 손수레 철길이었어요. 지금은 알록달록한 작은 열차가 되어 옛거리 건너편에서 폭포 앞까지 약 1.6km를 10분쯤 달려요.','계곡을 내려다보며 숲길을 지나가서, 타는 것 자체가 하나의 구경거리예요.'],
  tips:['예약 필요 없어요 · 표는 탑승장에서 사요 (무인 발권기나 매표창구 · 현금 준비 · 편도 NT$50, 65세 이상 NT$30)','09:00~17:00 운행 · 비가 많이 오면 쉬어요']},
 wulaifall:{gm:'https://www.google.com/maps/search/?api=1&query=%E7%83%8F%E4%BE%86%E7%80%91%E5%B8%83',img:'img/wulaifall.jpg',lbl:'폭포',title:'우라이 폭포',zh:'烏來瀑布',key:'꼬마기차 종점 앞, 높이 약 80m 폭포',
  text:['꼬마기차에서 내리면 계곡 건너편 절벽에서 두 갈래로 쏟아지는 폭포가 바로 보여요. 높이가 약 80m로 대만 북부에서 손꼽히는 폭포예요.','전망대 난간 앞에서 가족사진 찍기 좋은 곳이에요. 비 온 다음 날이면 물줄기가 더 굵어져요.'],
  tips:['전망대에서 20~30분 머물고 꼬마기차로 돌아와요']},

const pop=$('#pop'),sheet=$('#sheet');let lastFocus=null;
function openSheet(d,o){const R=!!(o&&o.route);const RT=d.route?`<div class="route"><h4>현장 지도 · 걷는 동선</h4><p class="rhint">번호는 지도 위 번호와 같아요 · P는 차 타고 내리는 곳</p><a class="rlink" href="${d.route.img}" target="_blank" rel="noopener"><img class="rmap" src="${d.route.img}" alt="${esc(d.title)} 걷는 동선 지도" loading="lazy"></a><small>지도를 누르면 크게 보고 확대할 수 있어요</small><ol>${(()=>{let n=0;return d.route.steps.map(r=>{const P=/내리|내려|승차/.test(r[1]);const bn=P?'P':++n;return `<li><time>${esc(r[0])}</time><div><b><em class="nb${P?' p':''}">${bn}</em>${esc(r[1])}</b><span>${esc(r[2])}</span>${r[3]?`<a class="pinl" href="${r[3]}" target="_blank" rel="noopener">구글 지도 ›</a>`:''}</div></li>`}).join('')})()}</ol>${d.route.map?`<div class="walks in-sheet"><div class="walks-h">구글 지도로 경로 보기</div><a href="${d.route.map}" target="_blank" rel="noopener"><span>도보</span>${esc(d.title)} 경로<i>›</i></a><p class="walks-note">여러 곳을 잇는 경로라 앱에서는 선이 작게 보여요. 한 곳씩 갈 때는 위 번호마다 있는 “구글 지도”를 누르세요.</p></div>`:''}<small>간략 지도예요. 실제 거리·방향과 조금 달라요.</small></div>`:'';lastFocus=document.activeElement;sheet.classList.toggle('mapview',!!d.map);
  sheet.innerHTML=`${d.img&&!R?`<img${d.fit?' class="fit"':''} src="${d.img}" alt="${esc(d.title)}">`:''}<div class="in"><span class="lbl">${esc(d.lbl)}</span><h3 id="popTitle">${esc(d.title)}</h3><span class="zhn">${esc(d.zh)}</span>${R?RT+'<h4 class="about">장소 이야기</h4>':''}${d.route&&!R?'<button class="jumpr" type="button">걷는 동선 · 현장 지도 보기 ↓</button>':''}${d.spice?`<p class="spice">${esc(d.spice)}</p>`:''}${d.key?`<p class="key">${esc(d.key)}</p>`:''}${d.text.map(t=>`<p>${esc(t)}</p>`).join('')}${d.tips&&d.tips.length?`<ul>${d.tips.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:''}${d.shop?`<div class="shop"><b>${esc(d.shop.name)}</b><span>${esc(d.shop.addr)}</span><span>${esc(d.shop.hours)}</span><a href="${d.shop.map}" target="_blank" rel="noopener">구글 지도에서 보기 ›</a></div>`:''}${d.gm?`<div class="walks in-sheet maps"><div class="walks-h">구글 지도에서 보기</div><a href="${d.gm}" target="_blank" rel="noopener"><span>장소</span>${esc(d.title)}<i>›</i></a>${(d.spots||[]).map(x=>`<a href="${x[3]}" target="_blank" rel="noopener"><span>${esc(x[0])}</span><b>${esc(x[1])}<small>${esc(x[2])}</small></b><i>›</i></a>`).join('')}</div>`:''}${R?'':RT}${d.note?`<p class="note2">${esc(d.note)}</p>`:''}${d.ref?'<span class="credit">참고 사진 (같은 종류 음식의 예시)</span>':''}</div><button type="button" class="close">닫기</button>`;
  sheet.querySelector('.close').addEventListener('click',closeTop);const jr=sheet.querySelector('.jumpr');if(jr)jr.addEventListener('click',()=>sheet.querySelector('.route').scrollIntoView({behavior:'smooth',block:'start'}));pop.hidden=false;sheet.scrollTop=0;sheet.querySelector('.close').focus({preventScroll:true});
  openLayer(()=>{pop.hidden=true;lastFocus&&lastFocus.focus()})}
const closeSheet=closeTop;
pop.addEventListener('click',e=>{if(e.target===pop){closeTop();return}const a=e.target.closest('a.rlink');if(a){e.preventDefault();const im=a.querySelector('img');openViewer(a.getAttribute('href'),im?im.alt:'')}});
const cov=$('#cardOv');
function openCard(c){$('#cardKo').textContent=c.ko;const cn=$('#cardCn');cn.replaceChildren();c.cn.split('\n').forEach((l,j)=>{const d=el('div');d.textContent=l;if(j)d.style.fontSize='0.55em';cn.appendChild(d)});$('#cardSub').textContent=c.sub;cov.hidden=false;$('#cardClose').focus();openLayer(()=>{cov.hidden=true})}
$('#cardClose').addEventListener('click',()=>closeTop());
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeTop()});

/* layers + back button: every popup adds a history step, so the phone's back button closes it first */
const layers=[];let skipPop=0;
function openLayer(fn){let h=false;try{history.pushState({p:cur,layer:1},'',location.hash);h=true}catch(e){}layers.push({fn,h})}
function closeTop(fromPop){const L=layers.pop();if(!L)return;L.fn();if(fromPop!==true&&L.h){skipPop++;try{history.back()}catch(e){skipPop--}}}
window.addEventListener('popstate',e=>{if(skipPop){skipPop--;return}if(layers.length){closeTop(true);return}const id=(e.state&&e.state.p)||(location.hash||'').slice(1)||'home';show(id,true)});

/* map viewer: pinch / drag / double-tap / wheel / buttons */
const zv=$('#zv'),zst=$('#zvStage'),zim=$('#zvImg');let zs=1,zx=0,zy=0,zfit=1;const ptr=new Map();let pinch=null,lastTap=0,tapPt=null;
function zclamp(){const W=zst.clientWidth,H=zst.clientHeight,w=zim.naturalWidth*zs,h=zim.naturalHeight*zs;
  zx=w<=W?(W-w)/2:Math.min(0,Math.max(W-w,zx));zy=h<=H?(H-h)/2:Math.min(0,Math.max(H-h,zy))}
function zapply(){zclamp();zim.style.transform=`translate(${zx}px,${zy}px) scale(${zs})`}
function zfitNow(){const W=zst.clientWidth,H=zst.clientHeight;zfit=Math.min(W/zim.naturalWidth,H/zim.naturalHeight);zs=zfit;zx=0;zy=0;zapply()}
function zoomAt(px,py,ns){ns=Math.max(zfit,Math.min(zfit*6,ns));zx=px-(px-zx)*(ns/zs);zy=py-(py-zy)*(ns/zs);zs=ns;zapply()}
function rel(e){const r=zst.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function openViewer(src,alt){zim.onload=zfitNow;zim.alt=alt||'지도';zim.src=src;zv.hidden=false;if(zim.complete&&zim.naturalWidth)zfitNow();$('#zvClose').focus();openLayer(()=>{zv.hidden=true})}
$('#zvClose').addEventListener('click',()=>closeTop());
$('#zvIn').addEventListener('click',()=>zoomAt(zst.clientWidth/2,zst.clientHeight/2,zs*1.6));
$('#zvOut').addEventListener('click',()=>zoomAt(zst.clientWidth/2,zst.clientHeight/2,zs/1.6));
zst.addEventListener('wheel',e=>{e.preventDefault();const p=rel(e);zoomAt(p.x,p.y,zs*Math.exp(-e.deltaY*0.0015))},{passive:false});
zst.addEventListener('pointerdown',e=>{zst.setPointerCapture(e.pointerId);ptr.set(e.pointerId,rel(e));
  if(ptr.size===2){const [a,b]=[...ptr.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),mx:(a.x+b.x)/2,my:(a.y+b.y)/2,s:zs,x:zx,y:zy}}});
zst.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;const prev=ptr.get(e.pointerId),p=rel(e);ptr.set(e.pointerId,p);
  if(ptr.size>=2&&pinch){const [a,b]=[...ptr.values()];const d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    const ns=Math.max(zfit,Math.min(zfit*6,pinch.s*d/pinch.d));zx=mx-(pinch.mx-pinch.x)*(ns/pinch.s);zy=my-(pinch.my-pinch.y)*(ns/pinch.s);zs=ns;zapply()}
  else if(ptr.size===1){zx+=p.x-prev.x;zy+=p.y-prev.y;zapply()}});
function zup(e){const p=ptr.get(e.pointerId);ptr.delete(e.pointerId);if(ptr.size<2)pinch=null;
  if(e.type==='pointerup'&&p&&ptr.size===0){const t=Date.now();if(t-lastTap<320&&tapPt&&Math.hypot(p.x-tapPt.x,p.y-tapPt.y)<30){zoomAt(p.x,p.y,zs>zfit*1.2?zfit:zfit*2.5);lastTap=0}else{lastTap=t;tapPt=p}}}
zst.addEventListener('pointerup',zup);zst.addEventListener('pointercancel',zup);
window.addEventListener('resize',()=>{if(!zv.hidden)zfitNow()});
</script>
</body></html>
